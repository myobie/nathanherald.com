<!DOCTYPE html>
<!-- Link preview card for a post (1200x630), rendered by bin/gen-og.
     Matches the hand made /og.png: pink Whitney on near white. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://cloud.typography.com/6836312/761366/css/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 0 52px; background: #FAFAFA;
    display: flex; flex-direction: column; justify-content: center;
    font-family: 'Whitney SSm A', 'Whitney SSm B', 'Helvetica Neue', sans-serif;
  }
  #title {
    margin: 0; color: #FF347F; font-weight: 800; line-height: 1.12;
    font-size: 112px; max-height: 440px; overflow: hidden;
    overflow-wrap: break-word; text-wrap: balance;
  }
  #site {
    margin-top: 40px; font-size: 46px; color: #C9366C;
    text-decoration: underline; text-decoration-color: #001F3F;
    text-decoration-thickness: 3px; text-underline-offset: 8px;
  }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <div id="site">nathanherald.com</div>
  <script>
    const data = /*DATA*/{ "title": "A post title" }
    const t = document.getElementById('title')
    t.textContent = data.title
    // Shrink long titles until they fit
    window.fit = () => {
      let size = 112
      while (size > 48 && t.scrollHeight > 440) { size -= 4; t.style.fontSize = size + 'px' }
    }
  </script>
</body>
</html>
